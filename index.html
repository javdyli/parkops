<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ParkOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operations console — top bar with role switch, tab strip, dense data panels; officer + driver views stack to one column on phones */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --surface-2:#e8edf4; --line:#d3dbe6; --fg:#121926; --muted:#586475;
  --accent:#1a56cc; --accent-fg:#ffffff; --accent-soft:#e3ecfc;
  --stripe:#e8a800; --stripe-soft:#fff3cf;
  --ok:#1b7f47; --ok-soft:#dff3e7; --warn:#a36a09; --warn-soft:#fbefd6; --bad:#bf3328; --bad-soft:#fbe3e0;
  --plate-bg:#fbfcfe; --plate-fg:#0f1a33; --plate-line:#27365a;
  --shadow:0 1px 2px rgba(18,25,38,.06),0 4px 16px rgba(18,25,38,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#151b24; --surface-2:#1c2430; --line:#2a3442; --fg:#e6ebf2; --muted:#94a0b1;
  --accent:#5c8ff2; --accent-fg:#0b1120; --accent-soft:#1a2740;
  --stripe:#f4c343; --stripe-soft:#352a0d;
  --ok:#46b77b; --ok-soft:#12291c; --warn:#e3a646; --warn-soft:#2e2310; --bad:#ef6d62; --bad-soft:#35191a;
  --plate-bg:#e9edf3; --plate-fg:#0f1a33; --plate-line:#5c6b86;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#151b24; --surface-2:#1c2430; --line:#2a3442; --fg:#e6ebf2; --muted:#94a0b1;
  --accent:#5c8ff2; --accent-fg:#0b1120; --accent-soft:#1a2740;
  --stripe:#f4c343; --stripe-soft:#352a0d;
  --ok:#46b77b; --ok-soft:#12291c; --warn:#e3a646; --warn-soft:#2e2310; --bad:#ef6d62; --bad-soft:#35191a;
  --plate-bg:#e9edf3; --plate-fg:#0f1a33; --plate-line:#5c6b86;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.45rem} h3{font-size:1.15rem}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
a{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.pmark{width:32px;height:32px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.02em}
.brand span{display:block;font-size:.78rem;color:var(--muted);line-height:1.1}
.roles{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.roles button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.live{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.live.off i{background:var(--bad)}
.tabs{max-width:1320px;margin:0 auto;padding-inline:12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 9px 11px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-size:.86rem}
@media (min-width:1500px){.tabs button{padding:10px 12px 11px;font-size:.92rem}}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--stripe)}
.tabs .badge{margin-left:6px}

main{max-width:1320px;margin:0 auto;padding:22px 20px 60px;display:grid;gap:18px}
.banner{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;font-size:.9rem}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2,.panel-h h3{margin-right:auto}
.panel-b{padding:16px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.g2,.g2e{grid-template-columns:minmax(0,1fr)}}
.pagehead{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.pagehead h1{font-size:2rem;margin-right:auto;line-height:1}
.pagehead p{margin:4px 0 0;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.kpi small{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.84rem;color:var(--muted)}
.kpi.alert{border-color:var(--stripe);background:linear-gradient(var(--stripe-soft),var(--stripe-soft)) padding-box}

/* facility cards */
.facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fac{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--surface);cursor:pointer;text-align:left}
.fac:hover{border-color:var(--accent)}
.fac-top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.fac h3{font-size:1.1rem}
.fac .pct{font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:10px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.fac-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}

/* chips, pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--stripe);color:#1b1400;font-size:.72rem;font-weight:700}
.plate{display:inline-block;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;font-size:.95rem;background:var(--plate-bg);color:var(--plate-fg);border:1.5px solid var(--plate-line);border-radius:4px;padding:0 7px;line-height:1.5;white-space:nowrap;cursor:pointer}
.plates{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:.8rem;color:var(--muted)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.sm{padding:3px 9px;font-size:.8rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btn.lg{padding:12px 18px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field .help{font-size:.78rem;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.form-grid .span{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row>.field{flex:1 1 160px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:.86rem;cursor:pointer;color:var(--fg);font-weight:500}
.checks input{width:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{width:auto;min-width:0;flex:1 1 260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* lists */
.list{display:grid}
.li{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{font-weight:600}
.sev{width:4px;align-self:stretch;border-radius:2px;background:var(--line);flex:none}
.sev.ok{background:var(--ok)} .sev.warn{background:var(--warn)} .sev.bad{background:var(--bad)} .sev.info{background:var(--accent)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* enforcement */
.enf{max-width:760px;width:100%;margin:0 auto;display:grid;gap:16px}
.plate-in{font-family:var(--f-display);font-size:2.2rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;background:var(--plate-bg);color:var(--plate-fg);border:3px solid var(--plate-line);border-radius:10px;padding:8px 12px}
.plate-in::placeholder{color:#9aa6ba;letter-spacing:.08em}
.verdict{border-radius:var(--r);padding:18px;display:grid;gap:6px;border:2px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)} .verdict.warn{background:var(--warn-soft);border-color:var(--warn)} .verdict.bad{background:var(--bad-soft);border-color:var(--bad)}
.verdict h2{font-size:1.8rem}
.verdict.ok h2{color:var(--ok)} .verdict.warn h2{color:var(--warn)} .verdict.bad h2{color:var(--bad)}
.verdict ul{margin:4px 0 0;padding-left:18px}

/* portal */
.portal-hero{background:var(--accent);color:var(--accent-fg);border-radius:var(--r);padding:24px;display:grid;gap:6px;position:relative;overflow:hidden}
.portal-hero::after{content:"";position:absolute;right:-40px;bottom:-30px;width:260px;height:70px;background:repeating-linear-gradient(115deg,transparent 0 18px,var(--stripe) 18px 30px);opacity:.9;transform:rotate(-8deg)}
.portal-hero h1{font-size:2.1rem;line-height:1.05;position:relative}
.portal-hero p{margin:0;max-width:52ch;opacity:.92;position:relative}
.quote{font-family:var(--f-display);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums}
.receipt{border:1px dashed var(--ok);background:var(--ok-soft);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.note{font-size:.82rem;color:var(--muted)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:0;width:min(620px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.dlg-h h2{margin-right:auto}
.dlg-b{padding:18px;max-height:65vh;overflow:auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:50;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}
.skel{padding:60px 16px;text-align:center;color:var(--muted)}
@media (max-width:640px){
  .top-in{padding-inline:16px} main{padding-inline:16px}
  .brand span{display:none}
  .top{position:static}
  .roles button{padding:6px 10px}
  .pagehead h1{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v2 additions */
.big-count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big-count b{font-family:var(--f-display);font-size:3.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big-count span{color:var(--muted)}
.split{display:flex;gap:18px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.split b{color:var(--fg);font-variant-numeric:tabular-nums}
.url{display:flex;gap:6px;align-items:center;min-width:0}
.url code{font-family:var(--f-mono);font-size:.78rem;background:var(--surface-2);padding:3px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:340px;display:block}
.daynav{display:flex;align-items:center;gap:6px}
.daynav b{min-width:150px;text-align:center;font-weight:600}
.callout{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.callout.warn{border-left-color:var(--warn)}
.summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.summary-row div{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.summary-row small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.summary-row b{font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.summary-row .over b{color:var(--bad)}
tr.sel td{background:var(--accent-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
/* v4: self-parking, exit desk, tickets, reports, valet */
.stars{display:flex;gap:4px}.star{border:0;background:none;font-size:1.7rem;line-height:1;color:var(--line);cursor:pointer;padding:0 2px}.star:hover,.star:focus-visible,.star.on{color:var(--stripe)}
.subnav{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;flex-wrap:wrap;justify-self:start}
.subnav button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
.subnav button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
@media (max-width:900px){.desk{grid-template-columns:minmax(0,1fr)}}
.desk-in{font-family:var(--f-display);font-size:2rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center;background:var(--plate-bg);color:var(--plate-fg);border:3px solid var(--plate-line);border-radius:10px;padding:8px 12px}
.desk-in::placeholder{color:#9aa6ba;letter-spacing:.06em;font-size:1.2rem}
.due{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border:2px solid var(--accent);border-radius:var(--r);padding:14px 16px;background:var(--accent-soft)}
.due b{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.due.zero{border-color:var(--ok);background:var(--ok-soft)}
.due>div:first-child{display:grid;gap:2px}.due small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.due .facts{flex:1 1 260px}.due .facts b{font-family:var(--f-body);font-size:.95rem;font-weight:600;line-height:1.3}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.facts div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.facts small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.facts b{font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bill{width:100%;border-collapse:collapse;font-size:.9rem}.bill td{padding:6px 0;border-bottom:1px dashed var(--line)}.bill td.r{text-align:right;font-variant-numeric:tabular-nums}.bill tr.total td{border-bottom:0;font-weight:700;font-size:1.05rem}
.timeline{display:grid;gap:0}.tl{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}.tl:last-child{border-bottom:0}.tl time{color:var(--muted);font-variant-numeric:tabular-nums}.tl .who{color:var(--muted);font-size:.8rem}
@media (max-width:560px){.tl{grid-template-columns:1fr}}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 16px;font-size:.86rem;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:grid;gap:8px;min-height:120px}
.col h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:6px;font-size:.88rem}
.card .plate{justify-self:start}
.rlist{display:grid;gap:2px}.rlist button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--fg);display:grid;gap:2px}.rlist button:hover{background:var(--surface-2)}.rlist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rlist small{color:var(--muted);font-size:.78rem}.rlist h4{margin:10px 10px 4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

  /* ---------- time zones and parking days ---------- */
  const fmtCache = {};

      catch (e) { f = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

  /* Instant of a local wall-clock time. A time skipped by a DST jump resolves to the moment after the jump. */
  function zoned(y, mo, d, h, mi, tz) {

    const a = g - tzOffset(g, tz), b = g - tzOffset(a, tz);
    const ok = t => { const p = tzParts(t, tz); return p.hour === h && p.minute === mi && p.day === d; };

  }
  function addDays(y, m, d, n) { const x = new Date(Date.UTC(y, m - 1, d + n)); return [x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate()]; }

  function Rules(S, clock, opts) {
    const now = clock || (() => Date.now());
    opts = opts || {};
    const cfg = () => S.config || {};
    const L = k => S[k] || [];
    const fac = id => L('facilities').find(f => f.id === id);
    const ptype = id => L('permitTypes').find(t => t.id === id);
    const tenant = id => L('tenants').find(t => t.id === id);
    const camera = id => L('cameras').find(c => c.id === id);
    const tzOf = f => (f && f.timeZone) || (S.config && S.config.timeZone) || 'America/Chicago';
    const resetOf = f => { const r = String((f && f.rates && f.rates.resetTime) || '00:00').split(':'); return [+r[0] || 0, +r[1] || 0]; };
    /* Each visit keeps a copy of the rates it started under, so a rate change only affects new visits. */
    const snapRates = f => f && f.rates ? JSON.parse(JSON.stringify(f.rates)) : null;
    const facFor = s => { const f = fac(s.facilityId); return f && s.rates ? Object.assign({}, f, { rates: s.rates }) : f; };
    const ticketOf = s => (s && s.ticket) || ('T' + String((s && s.id) || '').slice(-6).toUpperCase());
    const fmtLocal = (t, f) => new Date(t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: tzOf(f) });

    const endOfDate = (str, f) => { const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(str || '').trim()); if (!m) return null; const [y, mo, d] = addDays(+m[1], +m[2], +m[3], 1); return zoned(y, mo, d, 0, 0, tzOf(f)); };
    const histAdd = (s, e) => ((s && s.history) || []).concat([{ at: now(), by: e.by || '', action: e.action, detail: String(e.detail || '').slice(0, 400) }]).slice(-100);

    function dayStart(t, f) {
      const tz = tzOf(f), [h, m] = resetOf(f), p = tzParts(t, tz);
      let s = zoned(p.year, p.month, p.day, h, m, tz);

    }
    function nextDayStart(s, f) {
      const tz = tzOf(f), [h, m] = resetOf(f), p = tzParts(s, tz);
      const [y, mo, d] = addDays(p.year, p.month, p.day, 1);
      let n = zoned(y, mo, d, h, m, tz);
      if (n <= s + H) { const [y2, m2, d2] = addDays(y, mo, d, 1); n = zoned(y2, m2, d2, h, m, tz); }

    }

    /* ---------- rates ----------
       rates = { mode: 'increment' | 'table', incrementMin, incrementPrice (or legacy hourly), table: [{upTo, price}],
                 afterMinutes, afterPrice, dailyMax, graceMin, resetTime, rolling, specials: [...] }
       A parking day runs from the reset time to the next reset time (or, with rolling on, 24 hours from arrival),
       and each parking day is capped at the daily maximum. In increment mode each started increment is billed to
       the day it starts in; in table mode each day's minutes are priced from the table. Specials (early bird,
       evening, weekend, event) are flat prices that apply when the whole stay qualifies; the driver pays the lower
       of the special and the regular rate. */
    const hm = x => { const [h, m] = String(x || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
    const pad2 = n => String(n).padStart(2, '0');
    function local(t, f) { const p = tzParts(t, tzOf(f)); return { mins: p.hour * 60 + p.minute, dow: new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay(), date: `${p.year}-${pad2(p.month)}-${pad2(p.day)}`, p }; }
    const incOf = r => ({ min: +r.incrementMin > 0 ? +r.incrementMin : 60, price: r.incrementPrice != null && r.incrementPrice !== '' ? +r.incrementPrice : +r.hourly || 0 });
    function tablePrice(r, mins) {
      const rows = (r.table || []).filter(x => +x.upTo > 0).sort((a, b) => a.upTo - b.upTo);
      if (!rows.length) return Math.ceil(mins / 60 - 1e-9) * (+r.hourly || 0);
      const row = rows.find(x => mins <= +x.upTo + 1e-9); if (row) return +row.price;
      const last = rows[rows.length - 1], inc = +r.afterMinutes > 0 ? +r.afterMinutes : 60;

      else if (Array.isArray(sp.days) && sp.days.length && !sp.days.map(Number).includes(s.dow)) return false;
      if (sp.noHolidays !== false && holidays.includes(s.date) && !(sp.dates && sp.dates.length)) return false;

       most this), full (nothing to pay). Free time never restarts the clock: it comes off the front of the stay. */
    function priceDetail(f, start, end, val) {
      const r = (f && f.rates) || {}, grace = +r.graceMin || 0;

    function rateSummary(f) {
      const r = (f && f.rates) || {}, out = [], dn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const t12 = x => { const m = hm(x), h = Math.floor(m / 60), mm = m % 60; return (h % 12 || 12) + (mm ? ':' + pad2(mm) : '') + (h < 12 ? 'am' : 'pm'); };

      const tax = round2(a * rate / 100); return { net: a, tax, total: round2(a + tax), rate };
    }

    const paidOf = s => round2(sum(s.payments || [], p => p.amount));
    const extrasOf = s => round2(+s.valetFee || 0);
    const freeKind = s => s.kind === 'permit' || !!s.vipFree;
    function sessionFee(s, end) {
      if (freeKind(s) || s.noEntry || s.noPlate) return 0;
      if (s.mode === 'prepaid' && !s.endAt) return paidOf(s);
      if (s.endAt && s.fee != null && !end) return +s.fee;

    }

    const balanceOf = s => (s.waived || s.cited || (s.missedExit && !s.missedResolved) || needsReview(s)) ? 0 : Math.max(0, round2(sessionFee(s) + (+s.lateFee || 0) + extrasOf(s) - paidOf(s)));
    /* Full bill for a ticket: parking breakdown, extras, late fee, payments, balance, tax. */
    function ticketBill(s, end) {
      const f = facFor(s), prepaidOpen = s.mode === 'prepaid' && !s.endAt && !end, at = end || s.endAt || (prepaidOpen ? Math.max(s.paidUntil || 0, s.startAt || 0) : now());
      const pd = (freeKind(s) || s.noEntry || s.noPlate) ? { amount: 0, rule: s.kind === 'permit' ? 'monthly' : s.vipFree ? 'vip' : 'none', days: [], standard: 0, special: null, discount: 0, freeMinutes: 0 } : priceDetail(f, s.startAt, at, s.validation);

    }
    const isLive = s => !s.endAt && (s.mode === 'lpr' || (s.paidUntil || 0) > now() - 12 * H);
    const onSiteSessions = f => L('sessions').filter(s => s.facilityId === f.id && !s.endAt && (s.mode === 'lpr' || (s.paidUntil || 0) > now()));

    /* ---------- collections ---------- */
    function plateDebt(pl) {

    /* One step per unpaid exit per run: notice, reminder, late fee at the end of grace, then an automatic citation. */

    /* Accounts receivable, aged from the day each amount became due. Buckets: current, 1-30, 31-60, 61-90, 91+. */

    /* ---------- reservations ---------- */

      else if (vip) { r.level = 'ok'; r.title = vip.freeParking ? 'VIP · no charge' : 'VIP'; r.suggest = null; r.lines.push([vip.name, vip.company, vip.note].filter(Boolean).join(' · ')); if (sess && !vip.freeParking) r.lines.push(sess.mode === 'prepaid' ? 'Paid until ' + new Date(sess.paidUntil).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tzOf(f) }) : 'On site since ' + fmtLocal(sess.startAt, f) + ' · ' + money(sessionFee(sess)) + ' accrued'); }
      else if (sess) {
        if (sess.mode === 'prepaid') {
          if (sess.paidUntil > now()) { r.level = 'ok'; r.title = 'Paid session'; r.suggest = null; r.lines.push('Paid until ' + new Date(sess.paidUntil).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tzOf(f) })); }

/* Hosted adapter: gives the console the same db interface it uses on claude.ai,

window.PARKOPS_HOSTED = (function () {
  const COLLS = ['facilities', 'permitTypes', 'permits', 'sessions', 'citations', 'validations', 'members', 'tenants', 'cameras', 'reservations', 'companies', 'invoices', 'vips', 'ratings'];
  const data = {}; COLLS.forEach(c => { data[c] = new Map(); });

    const h = { 'X-ParkOps': '1' }; if (body && !raw) h['Content-Type'] = 'application/json'; if (raw) h['Content-Type'] = raw;

    if (!r.ok) { const e = new Error((j.error && j.error.message) || ('Request failed (' + r.status + ')')); e.code = (j.error && j.error.code) || 'unavailable'; if (j.amount != null) e.amount = j.amount; throw e; }
    return j;
  }
  const strip = d => { const o = Object.assign({}, d); delete o.id; return o; };
  function docRef(coll, id) {
    const key = coll + '/' + id;
    return {
      id,
      async set(d) { await api('PUT', '/api/db/' + coll + '/' + id, d); local(coll, id, d); },
      async update(d) { await api('PATCH', '/api/db/' + coll + '/' + id, d); const cur = coll === 'settings' ? config : data[coll].get(id); local(coll, id, Object.assign({}, cur, d)); },
      async delete() { await api('DELETE', '/api/db/' + coll + '/' + id); local(coll, id, null); },
      onSnapshot(next) {
        const fn = () => {
          if (key === 'settings/config') next({ id, exists: !!config, data: () => config });
          else if (key === 'feeds/lpr') next({ id, exists: true, data: () => ({ reads: feed }) });
        };

      },

  }

    collection(c) {
      return {
        doc: id => docRef(c, id || ('x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7))),
        async add(d) { const r = await api('POST', '/api/db/' + c, d); local(c, r.id, d); return docRef(c, r.id); },
        onSnapshot(next) { const fn = () => next(snapOf(c)); (subs[c] = subs[c] || []).push(fn); setTimeout(fn, 0); return () => {}; },
      };
    },
    doc(path) { const [c, id] = path.split('/'); return docRef(c, id); },
  };

    const es = new EventSource('/api/stream');

  }

    get webhookBase() { return webhookBase; }, get terminal() { return terminal; }, get email() { return email; },
    get payments() { return payments; }, get account() { return account; }, set account(a) { account = a; }, get user() { return user; }, get role() { return role; }, get sms() { return sms; },
    api,
    async init() {

      const roles = role === 'public' ? ['portal'] : role === 'attendant' ? ['ops', 'enf', 'portal'] : role === 'viewer' || role === 'accountant' ? ['ops', 'portal'] : ['ops', 'enf', 'portal'];

    },
    logout() { fetch('/logout', { method: 'POST', headers: { 'X-ParkOps': '1' }, credentials: 'same-origin' }).catch(() => {}).then(() => { location.href = '/'; }); },
    async lprRead(inp) { try { return await api('POST', '/api/lpr/test', inp); } catch (e) { return { level: 'bad', text: e.message }; } },
    async lprImport(reads) { return api('POST', '/api/lpr/import', { reads }); },
    async portal(op, args, payment, expectedAmount) { try { return await api('POST', '/api/portal/' + op, { args, payment, expectedAmount }); } catch (e) { return { error: e.message, amount: e.amount }; } },
    async lookup(plate) { try { return await api('GET', '/api/portal/lookup?plate=' + encodeURIComponent(plate)); } catch (e) { return null; } },
    download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); },
  };
})();

/* ============ charts ============ */
function niceMax(v){if(v<=0)return 10;const p=10**Math.floor(Math.log10(v));const m=v/p;const s=[1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(x=>m<=x);return s*p}
const axisText=(x,y,t,anchor='end',extra='')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace" ${extra}>${t}</text>`;
function revChart(days){
  const W=640,Hh=230,pl=52,pr=10,pt=14,pb=30,iw=W-pl-pr,ih=Hh-pt-pb;
  const tot=days.map(d=>d.parking+d.citations+d.permits);const max=niceMax(Math.max(...tot,100));
  const y=v=>pt+ih-(v/max)*ih;const bw=Math.min(46,iw/days.length*.58);
  let g='';[0,.25,.5,.75,1].forEach(t=>{const v=t*max;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`+axisText(pl-8,y(v)+4,money0(v))});
  days.forEach((d,i)=>{const cx=pl+(i+.5)*iw/days.length;const x=cx-bw/2;let base=0;const last=i===days.length-1;
    [['parking','var(--accent)'],['permits','var(--ok)'],['citations','var(--stripe)']].forEach(([k,c])=>{const v=d[k];if(v<=0)return;const y1=y(base+v),y0=y(base);g+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1,y0-y1)}" fill="${c}"><title>${d.label} ${k}: ${money(v)}</title></rect>`;base+=v});
    g+=`<text x="${cx}" y="${Hh-10}" text-anchor="middle" font-size="12" fill="${last?'var(--fg)':'var(--muted)'}" font-weight="${last?600:400}" font-family="Barlow, sans-serif">${last?'Today':d.label}</text>`;
    if(tot[i]>0)g+=axisText(cx,y(tot[i])-5,money0(tot[i]),'middle','fill-opacity="1" style="fill:var(--fg)"')});
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Revenue for the last 7 days">${g}</svg>`;
}
/* Step chart of vehicles on site across one parking day. */
function stepChart({pts,from,to,cap,capLabel,offset=0,tz,label}){
  const W=760,Hh=250,pl=46,pr=14,pt=16,pb=30,iw=W-pl-pr,ih=Hh-pt-pb;
  const peak=Math.max(0,...pts.map(p=>p[1]+offset));const max=niceMax(Math.max(peak,cap||0)*1.12||10);
  const x=t=>pl+((t-from)/(to-from))*iw, y=v=>pt+ih-(v/max)*ih;
  let g='';
  for(let i=0;i<=4;i++){const v=Math.round(max*i/4);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`+axisText(pl-6,y(v)+4,v.toLocaleString())}
  for(let h=0;h<=24;h+=3){const t=from+h*H;if(t>to)break;g+=axisText(x(t),Hh-10,new Date(t).toLocaleTimeString([], {hour:'numeric',timeZone:tz}),'middle')}
  let d='';pts.forEach((p,i)=>{const X=x(Math.max(from,Math.min(to,p[0]))),Y=y(p[1]+offset);d+=i?`H${X.toFixed(1)}V${Y.toFixed(1)}`:`M${X.toFixed(1)},${Y.toFixed(1)}`});
  const last=pts[pts.length-1];const area=d+`V${y(0)}H${x(pts[0][0])}Z`;
  const cid='clip'+Math.random().toString(36).slice(2,7);
  g+=`<path d="${area}" fill="var(--accent)" fill-opacity=".14"/>`;
  if(cap){g+=`<clipPath id="${cid}"><rect x="${pl}" y="${pt}" width="${iw}" height="${Math.max(0,y(cap)-pt)}"/></clipPath><path d="${area}" fill="var(--bad)" fill-opacity=".35" clip-path="url(#${cid})"/>`}
  g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  if(cap)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(cap)}" y2="${y(cap)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-pr}" y="${y(cap)-6}" text-anchor="end" font-size="12" fill="var(--bad)" font-family="Barlow, sans-serif" font-weight="600">${esc(capLabel||'Limit')} ${cap.toLocaleString()}</text>`;
  if(last&&last[0]<to-60000)g+=`<circle cx="${x(last[0])}" cy="${y(last[1]+offset)}" r="4" fill="var(--accent)"/>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(label||'Vehicles on site over the day')}">${g}</svg>`;
}
function peakBars(days,allot,tz){
  const W=760,Hh=220,pl=46,pr=14,pt=16,pb=30,iw=W-pl-pr,ih=Hh-pt-pb;
  const max=niceMax(Math.max(allot||0,...days.map(d=>d.peak))*1.12||10);const y=v=>pt+ih-(v/max)*ih;const bw=iw/days.length*.7;
  let g='';for(let i=0;i<=4;i++){const v=Math.round(max*i/4);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`+axisText(pl-6,y(v)+4,v)}
  days.forEach((d,i)=>{const cx=pl+(i+.5)*iw/days.length;const over=d.peak>allot;
    g+=`<rect x="${cx-bw/2}" y="${y(d.peak)}" width="${bw}" height="${Math.max(0,y(0)-y(d.peak))}" fill="${over?'var(--bad)':'var(--accent)'}" data-act="tenantDayPick" data-i="${i}" style="cursor:pointer"><title>${fmtDay(d.start,tz)}: peak ${d.peak}${over?`, ${d.over} over`:''}</title></rect>`;

}

function revenueByDay(n){
  const days=[];const d0=new Date();d0.setHours(0,0,0,0);
  for(let i=n-1;i>=0;i--){const s=d0.getTime()-i*D;days.push({s,e:s+D,label:new Date(s).toLocaleDateString([], {weekday:'short'}),parking:0,citations:0,permits:0})}
  const put=(t,k,a)=>{const d=days.find(x=>t>=x.s&&t<x.e);if(d)d[k]+=+a||0};
  S.sessions.forEach(s=>(s.payments||[]).forEach(p=>put(p.at,'parking',p.amount)));
  S.citations.forEach(c=>{if(c.status==='paid'&&c.paidAt)put(c.paidAt,'citations',c.fine)});
  S.permits.forEach(p=>{if(p.paidAt)put(p.paidAt,'permits',p.amountPaid)});
  if(HOSTED&&window.hostedRevenue){const h=window.hostedRevenue(days);if(h)return h}
  return days;
}
function emptyFacilities(){return `<div class="panel"><div class="empty"><h2 style="margin-bottom:6px">No garages or lots yet</h2><p>Add your first facility with its capacity, rates and daily reset time.</p>${canEditOps()?'<button class="btn pri" data-act="editFacility">Add a facility</button>':''}</div></div>`}
function attentionItems(){
  const it=[];
  const pend=S.permits.filter(p=>p.status==='pending');const wl=S.permits.filter(p=>p.status==='waitlist');
  const ap=S.citations.filter(c=>c.status==='appeal');const un=R.unpaidSessions();
  const grace=(+(S.config&&S.config.unpaidGraceHours)||48)*H;const late=un.filter(s=>now()-s.endAt>grace);
  const stale=S.sessions.filter(s=>!s.endAt&&s.mode==='lpr'&&now()-s.startAt>R.staleHours()*H&&s.kind!=='permit'&&!s.valet);
  const noEntry=S.sessions.filter(s=>(s.noEntry)&&!s.reviewed&&now()-s.endAt<D);

  if(rv.length)it.push({sev:'warn',t:`${rv.length} exit${rv.length>1?'s':''} held for review (plate misread or missed exit)`,go:'review'});

  if(pend.length)it.push({sev:'info',t:`${pend.length} monthly request${pend.length>1?'s':''} to review`,go:'permits',f:'pending'});

  if(late.length)it.push({sev:'bad',t:`${late.length} unpaid exit${late.length>1?'s':''} past the ${grace/H}-hour grace period (${money(sum(late,R.balanceOf))})`,go:'selfparking',f:'unpaid'});
  else if(un.length)it.push({sev:'warn',t:`${un.length} unpaid exit${un.length>1?'s':''} within grace period (${money(sum(un,R.balanceOf))})`,go:'selfparking',f:'unpaid'});
  const vreq=S.sessions.filter(s=>s.valet&&!s.endAt&&s.valet.status==='requested');

  if(noEntry.length)it.push({sev:'warn',t:`${noEntry.length} exit${noEntry.length>1?'s':''} in the last 24 hours had no matching entry read`,go:'review'});

const VAL_TYPES=[['hours','Free time (hours from arrival)'],['percent','Percent off'],['dollar','Dollars off'],['fixed','Fixed final price'],['full','Covers the full stay']];

function vLpr(){

  return `<div class="pagehead"><div><h1>Cameras</h1><p>Each entry and exit lane camera sends plate reads here. Entries add a car to the count, exits remove it and settle the charge.</p></div><button class="btn pri" data-act="editCamera">Add lane camera</button></div>
  ${HOSTED?'':`<div class="callout warn"><b>Live camera connection runs on the hosted version.</b> This page can’t receive camera traffic directly. Deploy the ParkOps server from the download, then point each camera at its lane URL. Until then, use test reads or import a CSV export from your cameras.</div>`}

  ${cams.length?`<div class="tbl-wrap"><table><thead><tr><th>Camera</th><th>Facility</th><th>Lane</th><th class="r">Reads today</th><th>Last read</th><th>Camera sends to</th><th></th></tr></thead><tbody>${cams.map(c=>{const f=facById(c.facilityId);const u=webhookUrl(c);
    return `<tr><td><b>${esc(c.name)}</b><span class="sub">${esc(c.model||'')}</span></td><td>${esc(f?f.name:'—')}</td><td><span class="pill ${c.direction==='in'?'ok':'info'}">${c.direction==='in'?'Entry':'Exit'}</span></td><td class="r num">${reads(c)}</td><td class="num">${c.lastReadAt?ago(c.lastReadAt):'Never'} ${stale(c)?'<span class="pill warn">Quiet</span>':''}${c.lastPlate?`<span class="sub">${esc(c.lastPlate)}</span>`:''}</td>
    <td>${u?`<div class="url"><code title="${esc(u)}">${esc(u)}</code><button class="btn sm" data-act="copy" data-v="${esc(u)}">Copy</button></div>`:'<span class="muted">Shown once hosted</span>'}</td><td><div class="acts"><button class="btn sm" data-act="editCamera" data-id="${c.id}">Edit</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No lane cameras yet. Add one camera per entry lane and one per exit lane.</div>'}</section>
  <div class="grid g2e">
  <section class="panel"><div class="panel-h"><h2>Send a test read</h2></div><form class="panel-b" data-form="lprRead" style="display:grid;gap:12px">
    <div class="form-grid"><div class="field span"><label for="lCam">Lane camera</label><select id="lCam">${cams.map(c=>`<option value="${c.id}">${esc((facById(c.facilityId)||{}).name||'')} · ${esc(c.name)} (${c.direction==='in'?'entry':'exit'})</option>`).join('')||'<option value="">Add a lane camera first</option>'}</select></div>
    <div class="field span"><label for="lPlate">Plate read</label><input id="lPlate" autocomplete="off" placeholder="e.g. 8KDM214, or leave blank for a no-plate read" style="text-transform:uppercase"></div></div>
    <div class="row"><button class="btn pri" ${cams.length?'':'disabled'}>Process read</button>${UI.lprResult?`<span class="pill dot ${UI.lprResult.level==='info'?'info':UI.lprResult.level}">${esc(UI.lprResult.text)}</span>`:''}</div>
  </form></section>

async function importCsv(file){
  const text=await file.text();const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length){toast('That file is empty.',true);return}
  let rows=lines.map(l=>l.split(',').map(x=>x.trim().replace(/^"|"$/g,'')));
  if(/plate/i.test(rows[0][0]))rows=rows.slice(1);
  const parsed=[];let bad=0;
  rows.forEach(r=>{const [p,cam,t]=r;const c=S.cameras.find(x=>x.id===cam||x.name.toLowerCase()===String(cam||'').toLowerCase());const at=t?Date.parse(t):now();
    if(!c||isNaN(at)){bad++;return}parsed.push({plate:p,cameraId:c.id,at})});
  if(parsed.length>500){toast('Import up to 500 reads at a time.',true);return}
  parsed.sort((a,b)=>a.at-b.at);toast(`Processing ${parsed.length} reads…`);
  if(HOSTED){const r=await HOSTED.lprImport(parsed);toast(`Imported ${r.count} reads${bad?`, skipped ${bad} rows`:''}`);return}
  for(const r of parsed)await lprRead(r);
  toast(`Imported ${parsed.length} reads${bad?`, skipped ${bad} rows with an unknown camera or time`:''}`);
}

async function issueCitation({plate,facId,code,officer,notes,sessionId,plateState,photoIds}){

  if(dup){toast(`${pl} already has this notice today (${dup.number}).`,true);return false}
  const number='C'+Date.now().toString(36).toUpperCase().slice(-6);

}

    const T=['startAt','endAt','paidUntil','createdAt','prepaidAt','issuedAt','paidAt','voidedAt','start','end','arrivedAt','completedAt','noShowAt','cancelledAt','at','lastReadAt','lastEventAt','waivedAt','adjustedAt','matchConfirmedAt','noticeAt','reminderAt','pastDueAt','paidThrough','pastDueSince','suspendedAt','approvedAt','startAt','expiresAt','validFrom'];
    const shift=v=>{if(Array.isArray(v))return v.map(shift);if(v&&typeof v==='object'){const o={};for(const [k,x] of Object.entries(v))o[k]=(T.includes(k)||/At$/.test(k))&&typeof x==='number'&&x>1e12?x+delta:shift(x);return o}return v};
    const ops=[];keys.forEach(k=>samp(k).forEach(x=>{const d=shift(x);delete d.id;ops.push({type:'set',coll:k,id:x.id,data:d})}));

<script>
/* Self-parking screens shared by both builds: exit desk, tickets, ticket detail, vehicles, VIP list,
   autopay accounts, plate review and the valet board. Loaded after app.js. */
(function () {
  Object.assign(UI, { spView: UI.spView || 'desk', tkStatus: UI.tkStatus || 'all', tkRange: UI.tkRange || 'today', tkFac: UI.tkFac || '', tkType: UI.tkType || 'all', tkQ: UI.tkQ || '', tkPage: 0, deskQ: '', deskFac: store.get('deskFac') || '', vipQ: '' });
  const PAGE = 50;
  const fname = id => (facById(id) || {}).name || '—';
  const tk = s => R.ticketOf(s);
  const tzS = s => tzF(facById(s.facilityId));
  const statusPill = s => { const st = R.exitStatus(s); const [c, l] = STATUS[st] || ['', st]; return `<span class="pill ${c}">${l}</span>`; };
  const typeTag = s => s.valet ? '<span class="tag">Valet</span>' : s.kind === 'permit' ? '<span class="tag">Monthly</span>' : s.kind === 'vip' ? '<span class="tag">VIP</span>' : s.kind === 'member' ? '<span class="tag">Autopay</span>' : s.mode === 'prepaid' ? '<span class="tag">Prepaid</span>' : s.manual ? '<span class="tag">Manual</span>' : '<span class="tag">Camera</span>';
  const dtLocal = t => { const d = new Date(t); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
  const ticketLink = s => `<button class="btn sm" data-act="openTicket" data-id="${esc(s.id)}">Details</button>`;

  /* ---------- printing (shared) ---------- */
  let printArea = document.getElementById('printArea');
  if (!printArea) { printArea = document.createElement('div'); printArea.id = 'printArea'; document.body.appendChild(printArea); }
  const pageStyle = document.createElement('style'); document.head.appendChild(pageStyle);
  window.printNow = (html, page) => { printArea.innerHTML = html; pageStyle.textContent = page ? `@page{size:${page};margin:0.35in}` : ''; window.print(); setTimeout(() => { pageStyle.textContent = ''; }, 1000); };
  function receiptHtml(s) {
    const b = R.ticketBill(s), f = facById(s.facilityId), tz = tzS(s), cfg = S.config || {};
    const t = x => x ? new Date(x).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: tz }) : '—';
    const rows = [];
    b.detail.days.forEach(d => rows.push([`Parking ${new Date(d.start).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: tz })} (${d.minutes} min)${d.capped ? ', daily max' : ''}`, money(d.amount)]));
    if (b.detail.special) rows.push([`${b.detail.special.name} rate`, money(b.detail.special.price)]);
    if (b.detail.freeMinutes) rows.push([`Validation ${s.validation.code}: ${b.detail.freeMinutes} min free`, '']);
    if (b.detail.discount && !b.detail.freeMinutes) rows.push([`Validation ${s.validation ? s.validation.code : ''}`, '-' + money(b.detail.discount)]);
    if (b.adjusted) rows.push(['Fee adjusted', money(b.parking)]);
    if (b.extras) rows.push(['Valet', money(b.extras)]);
    if (b.late) rows.push(['Late fee', money(b.late)]);

        ${hits.length > 1 ? `<div class="list" style="border:1px solid var(--line);border-radius:var(--r)">${hits.slice(0, 8).map(s => `<div class="li"><span class="sev info"></span>${plateChip(s.plate)}<div class="grow"><b>${esc(tk(s))}</b> · ${esc(fname(s.facilityId))}<span class="muted" style="display:block;font-size:.82rem">Arrived ${fmtTime(s.startAt, tzS(s))} · ${money(R.balanceOf(s))} due</span></div><button class="btn sm pri" data-act="deskPick" data-id="${esc(s.id)}">Check out</button></div>`).join('')}</div>` : ''}
      </form></section>
      <section class="panel"><div class="panel-h"><h2>On site now</h2><span class="muted" style="font-size:.84rem">${open.length} open ticket${open.length === 1 ? '' : 's'}${UI.deskFac ? ' at ' + esc(fname(UI.deskFac)) : ''}</span></div>
      ${open.length ? `<div class="tbl-wrap"><table><thead><tr><th>Plate</th><th>Ticket</th><th>Arrived</th><th class="r">Time</th><th class="r">Due</th></tr></thead><tbody>${open.slice(0, 40).map(s => `<tr class="click ${sel && sel.id === s.id ? 'sel' : ''}" data-act="deskPick" data-id="${esc(s.id)}" title="Check out"><td>${plateChip(s.plate)}${typeTag(s)}</td><td class="mono">${esc(tk(s))}</td><td class="num">${fmtTime(s.startAt, tzS(s))}</td><td class="r num">${dur(now() - s.startAt)}</td><td class="r num">${R.balanceOf(s) > 0 ? '<b>' + money(R.balanceOf(s)) + '</b>' : '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>${open.length > 40 ? `<div class="pager">Showing 40 of ${open.length}. Search for the rest.</div>` : ''}` : '<div class="empty">No cars on site.</div>'}</section>
    </div>
    <div>${sel ? checkoutPanel(sel) : `<section class="panel"><div class="empty"><h2 style="margin-bottom:6px">Exit desk</h2><p>Type the plate (or ticket number, key tag or phone) of the car leaving, press <span class="kbd">Enter</span>, and collect what’s due. Monthly parkers, VIPs and validated cars show nothing due.</p><p class="note"><span class="kbd">Enter</span> on a single match opens Collect · <span class="kbd">F2</span> next car · Working as <b>${esc(actorName())}</b> ${HOSTED ? '' : '<button class="btn sm" data-act="setStaffName">Change</button>'}</p></div></section>`}</div></div>`;
  }

  /* ---------- tickets list ---------- */
  const TYPE_F = { all: () => true, camera: s => s.mode === 'lpr' && !s.manual && !s.valet, prepaid: s => s.mode === 'prepaid', monthly: s => s.kind === 'permit', valet: s => !!s.valet, vip: s => s.kind === 'vip', manual: s => !!s.manual && !s.valet };
  const STATUS_F = { all: () => true, open: s => !s.endAt, unpaid: s => R.exitStatus(s) === 'unpaid', paid: s => !!s.endAt && ['paid', 'autopay', 'validated', 'free', 'permit', 'vip'].includes(R.exitStatus(s)), held: s => ['review', 'missed', 'noentry', 'noplate'].includes(R.exitStatus(s)), waived: s => !!s.waived, cited: s => !!s.cited, closed: s => !!s.endAt };
  function ticketRows() {
    const [from, to] = window.dateRange(UI.tkRange, UI.tkFrom, UI.tkTo), q = UI.tkQ.trim(), pl = normPlate(q), digits = q.replace(/\D/g, '');
    return S.sessions.filter(s => {
      if (s.noPlate && UI.tkStatus !== 'held') return false;
      const at = s.startAt || s.endAt || s.createdAt || 0;
      if (!(at >= from && at < to) && !(!s.endAt && (UI.tkStatus === 'all' || UI.tkStatus === 'open'))) return false;
      if (UI.tkFac && s.facilityId !== UI.tkFac) return false;
      if (!(TYPE_F[UI.tkType] || TYPE_F.all)(s) || !(STATUS_F[UI.tkStatus] || STATUS_F.all)(s)) return false;
      if (q) { const hay = [normPlate(s.plate), tk(s), s.valet && s.valet.tag ? normPlate(s.valet.tag) : '', s.validation ? s.validation.code : ''].join(' '); if (!hay.includes(pl) && !(digits.length >= 4 && s.phone && String(s.phone).replace(/\D/g, '').includes(digits))) return false; }
      return true;
    }).sort((a, b) => (b.startAt || b.endAt || 0) - (a.startAt || a.endAt || 0));
  }
  function vTickets() {
    const rows = ticketRows(), pages = Math.max(1, Math.ceil(rows.length / PAGE)); UI.tkPage = Math.min(UI.tkPage, pages - 1);
    const page = rows.slice(UI.tkPage * PAGE, (UI.tkPage + 1) * PAGE);
    const sel = (id, opts, val) => `<select id="${id}" data-fresh="1" style="width:auto">${opts.map(([k, l]) => `<option value="${k}" ${String(k) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    const owed = sum(rows, R.balanceOf), paid = sum(rows, R.paidOf);
    return `<section class="panel"><div class="panel-h"><div class="filters" style="margin-right:auto"><input id="tkQ" type="search" placeholder="Plate, ticket #, key tag, phone or code" value="${esc(UI.tkQ)}" data-fresh="1">
      ${sel('tkFac', [['', 'All locations']].concat(S.facilities.map(f => [f.id, f.name])), UI.tkFac)}
      ${sel('tkType', [['all', 'All types'], ['camera', 'Camera'], ['prepaid', 'Prepaid (QR)'], ['manual', 'Manual entry'], ['valet', 'Valet'], ['monthly', 'Monthly'], ['vip', 'VIP']], UI.tkType)}
      ${sel('tkStatus', [['all', 'Any status'], ['open', 'Open'], ['unpaid', 'Unpaid'], ['paid', 'Paid / no charge'], ['held', 'Held for review'], ['waived', 'Waived'], ['cited', 'Cited'], ['closed', 'Closed']], UI.tkStatus)}
      ${window.rangeControls('tk', UI.tkRange, UI.tkFrom, UI.tkTo)}</div><button class="btn sm" data-act="exportTickets" data-perm="export">Export CSV</button></div>
    <div class="panel-b" style="padding-bottom:0"><div class="split"><span><b>${rows.length}</b> ticket${rows.length === 1 ? '' : 's'}</span><span><b>${money(paid)}</b> paid</span><span><b>${money(owed)}</b> owed</span><span class="muted">Arrival date is used for the date range; open tickets are always listed under “Any status” and “Open”.</span></div></div>
    ${page.length ? `<div class="tbl-wrap"><table><thead><tr><th>Ticket</th><th>Plate</th><th>Location</th><th>Arrived</th><th>Departed</th><th class="r">Time</th><th class="r">Fee</th><th class="r">Paid</th><th class="r">Due</th><th>Validation</th><th>Status</th><th></th></tr></thead><tbody>${page.map(s => { const tz = tzS(s); return `<tr class="click" data-act="openTicket" data-id="${esc(s.id)}"><td class="mono">${esc(tk(s))}</td><td>${s.noPlate ? '<span class="pill warn">No plate</span>' : plateChip(s.plate)}${typeTag(s)}</td><td>${esc(fname(s.facilityId))}</td><td class="num">${s.startAt ? fmtTime(s.startAt, tz) : '—'}</td><td class="num">${s.endAt ? fmtTime(s.endAt, tz) : '<span class="pill info">On site</span>'}</td><td class="r num">${s.startAt ? dur((s.endAt || now()) - s.startAt) : '—'}</td><td class="r num">${money(R.sessionFee(s) + R.extrasOf(s))}</td><td class="r num">${money(R.paidOf(s))}</td><td class="r num">${R.balanceOf(s) > 0 ? '<b>' + money(R.balanceOf(s)) + '</b>' : '—'}</td><td>${s.validation ? `<span class="tag">${esc(s.validation.code)}</span>` : '—'}</td><td>${statusPill(s)}</td><td>${ticketLink(s)}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">No tickets match these filters.</div>'}
    ${pages > 1 ? `<div class="pager"><button class="btn sm" data-act="tkPage" data-v="-1" ${UI.tkPage === 0 ? 'disabled' : ''}>‹</button><span>Page ${UI.tkPage + 1} of ${pages}</span><button class="btn sm" data-act="tkPage" data-v="1" ${UI.tkPage >= pages - 1 ? 'disabled' : ''}>›</button></div>` : ''}</section>`;
  }

  /* ---------- ticket detail ---------- */
  function timeline(s) {
    const tz = tzS(s), items = [];
    if (s.startAt) items.push({ at: s.startAt, text: s.manual ? 'Ticket opened' + (s.valet ? ' (valet)' : ' by staff') : s.mode === 'prepaid' ? 'Paid by plate' + (s.prepaidAt ? '' : '') : 'Entered' + (s.entryCameraId ? ' · ' + ((byId('cameras', s.entryCameraId) || {}).name || 'camera') : ''), by: '' });
    if (s.prepaidAt && s.startLpr) items.push({ at: s.prepaidAt, text: 'Prepaid before arrival', by: '' });
    (s.payments || []).forEach(p => items.push({ at: p.at, text: `Payment ${money(p.amount)} · ${(ParkRules.METHODS[p.method] || p.method || '').toLowerCase()}${p.tendered != null ? ` (tendered ${money(p.tendered)})` : ''}${p.note ? ' · ' + p.note : ''}`, by: p.by || '' }));
    (s.history || []).forEach(h => { if (h.action === 'payment' || h.action === 'created') return; items.push({ at: h.at, text: `${({ validation_applied: 'Validation applied', validation_replaced: 'Validation replaced', validation_removed: 'Validation removed', departed: 'Departed', reopened: 'Reopened', waived: 'Balance waived', waive_removed: 'Waiver removed', fee_adjusted: 'Fee adjusted', note: 'Note', plate_corrected: 'Plate corrected', valet: 'Valet', match_confirmed: 'Plate match confirmed', match_rejected: 'Plate match rejected', missed_exit_resolved: 'Missed exit resolved', sent_to_review: 'Sent to plate review', entry_added: 'Arrival added', dismissed: 'Dismissed', cited: 'Notice issued' })[h.action] || h.action}${h.detail ? ' · ' + h.detail : ''}`, by: h.by || '' }); });
    if (s.endAt && !s.closedManually) items.push({ at: s.endAt, text: s.noEntry ? 'Exit read with no matching entry' : s.missedExit ? 'Closed: exit never read (a new entry was seen)' : 'Exited' + (s.exitCameraId ? ' · ' + ((byId('cameras', s.exitCameraId) || {}).name || 'camera') : '') + (s.matchedBy ? ` · read as ${s.exitPlate} (${s.matchedBy === 'fuzzy' ? 'one character off' : s.matchedBy === 'lookalike' ? 'look-alike characters' : s.matchedBy})` : ''), by: '' });
    S.feed.filter(r => r.sessionId === s.id && r.level !== 'ok' && r.level !== 'info').forEach(r => items.push({ at: r.at, text: 'Camera: ' + r.text, by: '' }));
    // Server audit rows: ticket actions already appear above (they write history), so only show direct edits and payment-device events.
    const audit = HOSTED && window.ticketAudit ? window.ticketAudit(s.id) : null;
    const AUD = { terminal_start: a => `Sent ${money(a.detail && a.detail.amount)} to the Square Terminal`, terminal_paid: a => `Paid ${money(a.detail && a.detail.amount)} on the Square Terminal`, terminal_cancel: () => 'Terminal payment cancelled', card_on_file: a => `Charged ${money(a.detail && a.detail.amount)} to the card on file` };
    (audit || []).forEach(a => {
      const ch = a.detail && a.detail.change;
      if (AUD[a.action]) { items.push({ at: a.at, text: AUD[a.action](a), by: a.actor || '' }); return; }
      if (a.action === 'set' && (s.history || []).some(h => h.action === 'created')) return;
      if (ch && (ch.history || ch.payments)) return;
      const keys = ch ? Object.keys(ch) : [];
      items.push({ at: a.at, text: a.action === 'delete' ? 'Record deleted' : `Edited directly${keys.length ? ': ' + keys.join(', ') : ''}`, by: a.actor || '' });
    });
    items.sort((a, b) => a.at - b.at);
    return items.length ? `<div class="timeline">${items.map(i => `<div class="tl"><time>${fmtTime(i.at, tz)}</time><div>${esc(i.text)}${i.by ? `<div class="who">${esc(i.by)}</div>` : ''}</div></div>`).join('')}</div>` : '<div class="empty">No activity yet.</div>';
  }
  function vTicket(id) {
    const s = byId('sessions', id); if (!s) return `<section class="panel"><div class="empty">That ticket isn’t loaded. <button class="btn sm" data-act="spView" data-v="tickets">Back to tickets</button></div></section>`;
    const b = R.ticketBill(s), f = facById(s.facilityId), tz = tzS(s), hosted = !!HOSTED, open = !s.endAt;
    const member = s.memberId ? byId('members', s.memberId) : R.memberForPlate(normPlate(s.plate)), permit = s.permitId ? byId('permits', s.permitId) : null, vip = s.vipId ? byId('vips', s.vipId) : null;
    const resv = s.reservationId ? byId('reservations', s.reservationId) : null, cit = s.citationId ? byId('citations', s.citationId) : null;
    const terminal = hosted && f && window.terminalCheckout && (f.terminalDeviceId || (HOSTED.terminal && (HOSTED.terminal.defaultDevice || HOSTED.terminal.simulated)));
    const act = (a, label, perm, cls) => `<button class="btn ${cls || ''}" data-act="${a}" data-id="${esc(s.id)}" ${perm ? `data-perm="${perm}"` : ''}>${label}</button>`;
    return `<div class="pagehead"><div><button class="btn sm" data-act="spView" data-v="tickets">‹ Tickets</button><h1 style="margin-top:8px">Ticket ${esc(tk(s))} ${statusPill(s)}</h1><p>${esc(f ? f.name : '')} · ${typeTag(s)}${s.rating ? ` · rated ${'★'.repeat(s.rating.stars)}` : ''}</p></div><div class="row" style="align-items:center">${plateChip(s.plate)}${s.plateOriginal ? `<span class="note">was ${esc(s.plateOriginal)}</span>` : ''}</div></div>

      <div style="display:grid;gap:18px">
        <section class="panel"><div class="panel-h"><h2>Visit</h2></div><div class="panel-b" style="display:grid;gap:14px">
          <div class="facts">
            <div><small>Arrived</small><b>${s.startAt ? fmtTime(s.startAt, tz) : '—'}</b>${s.startAt ? `<span class="note">${s.manual ? 'Manual entry' : s.mode === 'prepaid' ? 'Paid by plate' : (byId('cameras', s.entryCameraId) || {}).name || 'Camera'}</span>` : ''}</div>
            <div><small>Departed</small><b>${s.endAt ? fmtTime(s.endAt, tz) : 'On site'}</b>${s.endAt ? `<span class="note">${s.closedManually ? 'Closed by staff' : (byId('cameras', s.exitCameraId) || {}).name || (s.noEntry ? 'Camera' : '')}</span>` : ''}</div>
            <div><small>Duration</small><b>${s.startAt ? dur((s.endAt || now()) - s.startAt) : '—'}</b></div>
            <div><small>Rate at arrival</small><b>${esc(R.rateSummary(R.facFor(s))[0] || '—')}</b>${s.rates && f && JSON.stringify(s.rates) !== JSON.stringify(f.rates) ? '<span class="note">Rates changed since; this ticket keeps its own.</span>' : ''}</div>
            <div><small>Validation</small><b>${s.validation ? esc(s.validation.code) : 'None'}</b>${s.validation ? `<span class="note">${esc(R.validationText(s.validation))}${s.validation.tenantName ? ' · ' + esc(s.validation.tenantName) : ''}${s.validation.by ? ' · by ' + esc(s.validation.by) : ''}</span>` : ''}</div>
            <div><small>Eligibility</small><b>${permit ? 'Monthly #' + esc(permit.number) : vip ? 'VIP' + (s.vipFree ? ' (free)' : '') : member ? 'Autopay account' : R.validPermitFor(normPlate(s.plate), s.facilityId) ? 'Has monthly parking now' : 'Visitor'}</b>${resv ? `<span class="note">Reservation ${esc(resv.code)}</span>` : ''}</div>
            <div><small>Paid</small><b>${money(b.paid)}</b></div>
            <div><small>${b.due > 0 ? 'Balance due' : 'Balance'}</small><b style="${b.due > 0 ? 'color:var(--bad)' : ''}">${money(b.due)}</b>${s.waived ? '<span class="note">Waived</span>' : ''}${cit ? `<span class="note">Notice ${esc(cit.number)} (${esc(cit.status)})</span>` : ''}</div>
            ${s.valet ? `<div><small>Valet</small><b>${esc(s.valet.status || 'parked')}</b><span class="note">Key ${esc(s.valet.tag || '—')} · ${esc(s.valet.space || '')} · ${esc(s.valet.vehicle || '')}${s.valet.runner ? ' · ' + esc(s.valet.runner) : ''}</span></div>` : ''}
            ${s.phone ? `<div><small>Mobile</small><b>${esc(s.phone)}</b>${s.smsOptIn ? '<span class="note">Texts on</span>' : ''}</div>` : ''}
            ${s.notes ? `<div><small>Notes</small><b>${esc(s.notes)}</b></div>` : ''}
          </div>
          ${hosted && (s.entryPhotoId || s.exitPhotoId) ? `<div class="thumbs">${[s.entryPhotoId, s.exitPhotoId].filter(Boolean).map(p => `<a href="/photos/${esc(p)}" target="_blank" rel="noopener"><img src="/photos/${esc(p)}" alt="Plate photo" loading="lazy"></a>`).join('')}</div>` : ''}
          <div class="row" style="gap:8px">
            ${b.due > 0 && !R.needsReview(s) && !(s.missedExit && !s.missedResolved) ? act('deskPay', open ? `Collect ${money(b.due)} and close` : `Collect ${money(b.due)}`, 'tickets', 'pri') : ''}
            ${b.due > 0 && terminal ? act('deskTerminal', 'Square Terminal', 'tickets') : ''}
            ${b.due > 0 && hosted && member && window.chargeCardOnFile ? act('deskCardOnFile', 'Charge card on file', 'tickets') : ''}
            ${open ? act('deskClose', b.due > 0 ? 'Close (leave unpaid)' : 'Close ticket', 'tickets') : act('reopenTicket', 'Reopen', 'tickets.adjust')}
            ${!s.validation ? act('validateSession', 'Apply validation', 'tickets') : act('validateSession', 'Replace validation', 'tickets.adjust') + act('removeValidation', 'Remove validation', 'tickets.adjust')}
            ${!open ? act('adjustFee', 'Adjust fee', 'tickets.adjust') : ''}
            ${s.waived ? act('unwaive', 'Remove waiver', 'tickets.adjust') : (b.due > 0 || open) ? act('waiveSession', 'Waive', 'tickets.adjust') : ''}
            ${act('correctPlate', 'Correct plate', 'tickets.adjust')}${act('addNote', 'Add note', 'tickets')}
            ${b.paid > 0 || !open ? act('printReceipt', 'Print receipt') : ''}
            ${!open && b.due > 0 && !s.cited && !R.needsReview(s) && !(s.missedExit && !s.missedResolved) ? act('citeSession', 'Issue parking charge notice', 'citations', 'danger') : ''}

          </div>
        </div></section>
        <section class="panel"><div class="panel-h"><h2>Bill</h2><span class="muted" style="font-size:.84rem">${b.tax.tax ? `Prices ${(S.config || {}).taxIncluded === false ? 'plus' : 'include'} ${b.tax.rate}% sales tax` : ''}</span></div><div class="panel-b">${billTable(b, s)}</div></section>

      </div>

  }

  /* ---------- vehicles ---------- */
  function vVehicles() {
    const q = normPlate(UI.vehicle || '');
    if (q) return vVehicle(q);
    const recent = new Map();
    S.sessions.filter(s => !s.noPlate && (s.startAt || s.endAt) > now() - 30 * D).forEach(s => { const p = normPlate(s.plate); const r = recent.get(p) || { plate: p, visits: 0, paid: 0, last: 0 }; r.visits++; r.paid += R.paidOf(s); r.last = Math.max(r.last, s.endAt || s.startAt || 0); recent.set(p, r); });
    const rows = [...recent.values()].sort((a, b) => b.visits - a.visits).slice(0, 25);
    return `<div class="grid g2e">
      <section class="panel"><div class="panel-h"><h2>Find a vehicle</h2></div><form class="panel-b" data-form="vehicleFind" class="row"><div class="row"><div class="field"><label for="vhQ">License plate</label><input id="vhQ" autocomplete="off" style="text-transform:uppercase" placeholder="ABC1234"></div><button class="btn pri">Open</button></div><p class="note" style="margin:8px 0 0">Every visit, payment, notice, monthly plan and VIP flag for a plate. Click any plate anywhere in the console to get here.</p></form></section>
      <section class="panel"><div class="panel-h"><h2>Most frequent, last 30 days</h2></div>${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Plate</th><th class="r">Visits</th><th class="r">Paid</th><th>Last seen</th></tr></thead><tbody>${rows.map(r => `<tr><td>${plateChip(r.plate)}${R.validPermitFor(r.plate) ? ' <span class="tag">Monthly</span>' : ''}${R.vipForPlate(r.plate) ? ' <span class="tag">VIP</span>' : ''}</td><td class="r num">${r.visits}</td><td class="r num">${money(r.paid)}</td><td class="num">${fmtTime(r.last)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No visits in the last 30 days.</div>'}</section></div>`;
  }
  function vVehicle(pl) {
    const v = R.vehicleProfile(pl);
    const permit = v.permits.find(R.permitValid);
    return `<div class="pagehead"><div><button class="btn sm" data-act="vehicleBack">‹ Vehicles</button><h1 style="margin-top:8px">${esc(pl)}</h1><p>${v.visits} visit${v.visits === 1 ? '' : 's'}${v.firstSeen ? ' since ' + fmtDate(v.firstSeen) : ''}${v.hot ? ' · <span class="pill bad">Hot list</span>' : ''}</p></div>

    ${v.permits.length ? `<section class="panel"><div class="panel-h"><h2>Monthly parking</h2></div><div class="list">${v.permits.map(p => `<div class="li"><span class="sev ${R.permitValid(p) ? 'ok' : ''}"></span><div class="grow"><b>${esc((typeById(p.permitTypeId) || {}).name || 'Plan')} · #${esc(p.number)}</b><span class="muted" style="display:block;font-size:.82rem">${esc(p.holder)}${p.companyName ? ' · ' + esc(p.companyName) : ''}${p.paidThrough ? ' · paid through ' + fmtDate(p.paidThrough - 1) : ''}</span></div>${permitPill(p)}</div>`).join('')}</div></section>` : ''}`;

  /* ---------- plate review ---------- */
  window.vReview = function () {
    const held = S.sessions.filter(s => s.endAt && R.needsReview(s)).sort((a, b) => b.endAt - a.endAt);

    const noEntry = S.sessions.filter(s => s.noEntry && !s.noPlate && !s.reviewed && now() - s.endAt < 7 * D).sort((a, b) => b.endAt - a.endAt);

    const lowConf = S.feed.filter(r => r.confidence != null && r.confidence < 85 && now() - r.at < D);

    const d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const sec = (title, sub, n, html, empty) => `<section class="panel"><div class="panel-h"><h2>${title}</h2>${n ? `<span class="pill warn">${n}</span>` : ''}<span class="muted" style="font-size:.84rem">${sub}</span></div>${n ? html : `<div class="empty">${empty}</div>`}</section>`;
    return `<div class="pagehead"><div><h1>Plate review</h1><p>Camera reads that need a person: look-alike matches, missed exits, exits with no entry, unreadable plates and cars on site too long. Nothing here is billed until someone decides.</p></div></div>

    ${sec('Missed exits', 'The car came back in before its previous exit was read', missed.length, `<div class="tbl-wrap"><table><thead><tr><th>Plate</th><th>Location</th><th>Entered</th><th>Closed</th><th></th></tr></thead><tbody>${missed.map(s => `<tr><td>${plateChip(s.plate)}</td><td>${esc(fname(s.facilityId))}</td><td class="num">${fmtTime(s.startAt, tzS(s))}</td><td class="num">${fmtTime(s.endAt, tzS(s))}</td><td><div class="acts"><button class="btn sm" data-act="missedBill" data-id="${esc(s.id)}">Bill 1 day (${money(((R.facFor(s) || {}).rates || {}).dailyMax || 0)})</button><button class="btn sm" data-act="missedFree" data-id="${esc(s.id)}">No charge</button>${ticketLink(s)}</div></td></tr>`).join('')}</tbody></table></div>`, 'No missed exits.')}
    ${sec('Exits with no entry', 'Last 7 days. Add the arrival time to bill the stay, or dismiss', noEntry.length, `<div class="tbl-wrap"><table><thead><tr><th>Plate</th><th>Location</th><th>Exited</th><th>Possible entry</th><th></th></tr></thead><tbody>${noEntry.map(s => { const cand = S.sessions.filter(x => x.id !== s.id && !x.endAt && x.facilityId === s.facilityId && ParkRules.normPlate(x.plate).length && (x.plate.slice(0, 3) === s.plate.slice(0, 3) || x.plate.slice(-3) === s.plate.slice(-3))).slice(0, 2); return `<tr><td>${plateChip(s.plate)}</td><td>${esc(fname(s.facilityId))}</td><td class="num">${fmtTime(s.endAt, tzS(s))}</td><td>${cand.length ? cand.map(x => `${plateChip(x.plate)} <span class="sub">in ${fmtTime(x.startAt, tzS(x))}</span>`).join(' ') : '<span class="muted">—</span>'}</td><td><div class="acts"><button class="btn sm" data-act="addEntry" data-id="${esc(s.id)}" data-perm="tickets.adjust">Set arrival</button><button class="btn sm" data-act="dismissReview" data-id="${esc(s.id)}" data-perm="tickets.adjust">Dismiss</button>${ticketLink(s)}</div></td></tr>`; }).join('')}</tbody></table></div>`, 'Every exit matched an entry.')}

    ${sec('Unreadable plates', 'Last 48 hours', noPlate.length, `<div class="tbl-wrap"><table><thead><tr><th>Location</th><th>Entered</th><th>Exited</th><th></th></tr></thead><tbody>${noPlate.map(s => `<tr><td>${esc(fname(s.facilityId))}</td><td class="num">${s.startAt ? fmtTime(s.startAt, tzS(s)) : '—'}</td><td class="num">${s.endAt ? fmtTime(s.endAt, tzS(s)) : 'On site'}</td><td>${HOSTED && s.entryPhotoId ? `<a class="btn sm" href="/photos/${esc(s.entryPhotoId)}" target="_blank" rel="noopener">Photo</a>` : ''}${!s.endAt ? `<button class="btn sm" data-act="correctPlate" data-id="${esc(s.id)}" data-perm="tickets.adjust">Set plate</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`, 'No unreadable plates.')}
    <div class="grid g2e">
    <section class="panel"><div class="panel-h"><h2>Camera health</h2></div>${cams.length ? `<div class="tbl-wrap"><table><thead><tr><th>Camera</th><th>Lane</th><th class="r">Reads today</th><th>Last read</th></tr></thead><tbody>${cams.map(c => { const n = S.feed.filter(r => r.cameraId === c.id && r.at >= d0.getTime()).length, quiet = !c.lastReadAt || now() - c.lastReadAt > 2 * H; return `<tr><td><b>${esc(c.name)}</b><span class="sub">${esc(fname(c.facilityId))}</span></td><td>${c.direction === 'in' ? 'Entry' : 'Exit'}</td><td class="r num">${n}</td><td class="num">${c.lastReadAt ? ago(c.lastReadAt) : 'Never'} ${quiet ? '<span class="pill warn">Quiet</span>' : ''}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">No cameras.</div>'}</section>
    <section class="panel"><div class="panel-h"><h2>Low-confidence reads</h2><span class="muted" style="font-size:.84rem">Under 85%, last 24 hours</span></div>${lowConf.length ? `<div class="list">${lowConf.slice(0, 20).map(r => `<div class="li"><span class="sev warn"></span>${plateChip(r.plate)}<div class="grow">${esc(r.text)}<span class="muted" style="display:block;font-size:.82rem">${fmtTime(r.at)} · ${Math.round(r.confidence)}%</span></div></div>`).join('')}</div>` : '<div class="empty">None.</div>'}</section></div>`;

  /* ---------- valet board ---------- */
  window.vValet = function () {
    const facs = S.facilities.filter(f => f.active !== false);
    const live = S.sessions.filter(s => s.valet && !s.endAt && (!UI.valetFac || s.facilityId === UI.valetFac));

    const card = s => { const v = s.valet, due = R.balanceOf(s), waiting = v.requestedAt && ['requested', 'retrieving', 'ready'].includes(v.status) ? dur(now() - v.requestedAt) : ''; return `<div class="card">${plateChip(s.plate)}<div><b>${esc(v.vehicle || 'Vehicle')}</b> · key ${esc(v.tag || '—')}${v.space ? ' · ' + esc(v.space) : ''}</div><div class="muted">${esc(fname(s.facilityId))} · in ${fmtTime(s.startAt, tzS(s))}${waiting ? ' · waiting ' + waiting : ''}${v.runner ? ' · ' + esc(v.runner) : ''}</div><div class="row" style="gap:6px">${v.status === 'parked' ? `<button class="btn sm pri" data-act="valetStatus" data-id="${esc(s.id)}" data-v="requested" data-perm="valet">Requested</button>` : v.status === 'requested' ? `<button class="btn sm pri" data-act="valetStatus" data-id="${esc(s.id)}" data-v="retrieving" data-perm="valet">I’ll get it</button>` : v.status === 'retrieving' ? `<button class="btn sm pri" data-act="valetStatus" data-id="${esc(s.id)}" data-v="ready" data-perm="valet">At curb</button>` : `<button class="btn sm pri" data-act="valetDeliver" data-id="${esc(s.id)}" data-perm="valet">${due > 0 ? 'Collect ' + money(due) : 'Hand over'}</button>`}<button class="btn sm" data-act="openTicket" data-id="${esc(s.id)}">Ticket</button>${due > 0 ? `<span class="pill warn">${money(due)} due</span>` : R.paidOf(s) > 0 ? '<span class="pill ok">Paid</span>' : '<span class="pill">Nothing due yet</span>'}</div></div>`; };
    return `<div class="pagehead"><div><h1>Valet</h1><p>Cars parked by your valet team: keys, spaces, retrieval requests and handoff. Tenant valet companies that validate self-parked cars are under Validations & tenants.</p></div>
      <select id="valetFac" data-fresh="1" style="width:auto"><option value="">All locations</option>${facs.map(f => `<option value="${f.id}" ${f.id === UI.valetFac ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select><button class="btn pri" data-act="newValet" data-perm="valet">Park a car</button></div>
    <div class="kpis"><div class="kpi"><small>In valet now</small><b>${live.length}</b></div><div class="kpi ${live.some(s => s.valet.status === 'requested') ? 'alert' : ''}"><small>Waiting for a runner</small><b>${live.filter(s => s.valet.status === 'requested').length}</b></div><div class="kpi"><small>Ready at curb</small><b>${live.filter(s => s.valet.status === 'ready').length}</b></div><div class="kpi"><small>Delivered today</small><b>${delivered.length}</b><span>${money0(sum(delivered, R.paidOf))} collected</span></div></div>
    <div class="board">${cols.map(([k, l]) => { const list = live.filter(s => (s.valet.status || 'parked') === k).sort((a, b) => (a.valet[k + 'At'] || a.startAt) - (b.valet[k + 'At'] || b.startAt)); return `<div class="col"><h3><span>${l}</span><span>${list.length}</span></h3>${list.map(card).join('') || '<div class="note" style="text-align:center;padding:12px">Empty</div>'}</div>`; }).join('')}</div>
    ${delivered.length ? `<section class="panel"><div class="panel-h"><h2>Delivered today</h2></div><div class="tbl-wrap"><table><thead><tr><th>Plate</th><th>Vehicle</th><th>In</th><th>Out</th><th class="r">Paid</th><th></th></tr></thead><tbody>${delivered.map(s => `<tr><td>${plateChip(s.plate)}</td><td>${esc(s.valet.vehicle || '')}</td><td class="num">${fmtTime(s.startAt, tzS(s))}</td><td class="num">${fmtTime(s.endAt || s.valet.deliveredAt, tzS(s))}</td><td class="r num">${money(R.paidOf(s))}</td><td>${ticketLink(s)}</td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
  };

  /* ---------- monthly parkers from a spreadsheet ----------
     Columns (any order, header names are flexible): name, email, phone, plates, plan, company, paid through, number, notes.
     The preview shows what would be created and why rows are skipped; nothing is charged. */
  function parseCsv(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true; else if (c === ',' || c === '\t') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }
  const HEAD_MAP = { name: 'name', holder: 'name', parker: 'name', 'full name': 'name', email: 'email', 'e-mail': 'email', phone: 'phone', mobile: 'phone', cell: 'phone', plates: 'plates', plate: 'plates', 'license plate': 'plates', 'license plates': 'plates', tag: 'plates', plan: 'plan', type: 'plan', 'plan name': 'plan', rate: 'plan', company: 'company', employer: 'company', 'paid through': 'paidThrough', paidthrough: 'paidThrough', 'paid thru': 'paidThrough', number: 'number', '#': 'number', 'permit #': 'number', 'account #': 'number', notes: 'notes', note: 'notes', start: 'startAt', 'start date': 'startAt' };
  const rowsToObjects = rows => { const head = rows[0].map(h => HEAD_MAP[String(h).trim().toLowerCase()] || String(h).trim()); return rows.slice(1).map(r => { const o = {}; head.forEach((h, i) => { o[h] = r[i] != null ? String(r[i]).trim() : ''; }); return o; }); };
  /* Same checks the hosted server makes, for the pilot page. */
  function importLocal(rows, dry) {
    const norm = s => String(s || '').trim().toLowerCase(), created = [], skipped = [], ops = [];
    const planOf = x => S.permitTypes.find(t => t.id === x || norm(t.name) === norm(x)), coOf = x => x && S.companies.find(c => c.id === x || norm(c.name) === norm(x));
    const taken = new Map(); S.permits.forEach(pm => { if (['active', 'approved', 'pending', 'suspended'].includes(pm.status) && (!pm.endAt || pm.endAt > now())) (pm.plates || []).forEach(pl => taken.set(normPlate(pl), pm.number)); });
    rows.forEach((r, i) => {

<script>

(function () {

  const dayKey = (t, tz) => new Date(t).toLocaleDateString('en-CA', { timeZone: tz || (S.config || {}).timeZone || 'America/Chicago' });

  const kindName = { prepay: 'Parking (prepaid)', extend: 'Added time', balance: 'Parking balance', citation: 'Notice', reservation: 'Reservation fee', monthly: 'Monthly parking', autopay: 'Parking (autopay)', pay_all: 'Balances', parking: 'Parking', ticket: 'Parking (booth)', valet: 'Valet' };

  /* One list of every payment. Hosted: the server ledger (cards, cash, monthly, refunds). Pilot page: built from records. */
  function ledger() {
    if (HOSTED && window.hostedLedger) { const l = window.hostedLedger(); if (l) return l; }
    const out = [];
    S.sessions.forEach(s => (s.payments || []).forEach(p => { const t = R.taxOf(p.amount); out.push({ at: p.at, kind: p.method === 'autopay' ? 'autopay' : s.mode === 'prepaid' ? 'prepay' : 'parking', ref: tk(s), ticket: tk(s), plate: s.plate, facilityId: s.facilityId, method: p.method || 'online', amount: +p.amount || 0, tax: t.tax, net: t.net, refunded: 0, by: p.by || '', pid: p.pid || '', sessionId: s.id }); }));

    S.permits.forEach(p => { if (p.paidAt && +p.amountPaid) { const pl = typeById(p.permitTypeId); const t = R.taxOf(p.amountPaid); out.push({ at: p.paidAt, kind: 'monthly', ref: '#' + p.number, plate: (p.plates || [])[0] || '', facilityId: (pl && (pl.facilities || [])[0]) || '', method: p.billing === 'office' ? 'office' : 'card', amount: +p.amountPaid, tax: t.tax, net: t.net, refunded: 0, by: '' }); } });
    S.reservations.forEach(r => { if (r.paymentId && +r.premium) { const t = R.taxOf(r.premium); out.push({ at: r.createdAt, kind: 'reservation', ref: r.code, plate: r.plate, facilityId: r.facilityId, method: 'online', amount: +r.premium, tax: t.tax, net: t.net, refunded: r.refunded ? +r.premium : 0, by: '' }); } });

  const inRange = (t, from, to) => t >= from && t < to;

  const REPORTS = [
    { id: 'revenue', group: 'Money', name: 'Revenue summary', desc: 'Payments collected by day and type', filters: ['range', 'fac'], run(from, to) {

      const rows = [...days.values()].sort((a, b) => b.k.localeCompare(a.k)).map(d => [d.k, d.n, fx(d.parking), fx(d.monthly), fx(d.notices), fx(d.reservations), fx(d.other), fx(d.refunds), fx(d.parking + d.monthly + d.notices + d.reservations + d.other - d.refunds), fx(d.tax)]);
      const tot = [...days.values()].reduce((a, d) => ({ n: a.n + d.n, p: a.p + d.parking, m: a.m + d.monthly, c: a.c + d.notices, r: a.r + d.reservations, o: a.o + d.other, rf: a.rf + d.refunds, t: a.t + d.tax }), { n: 0, p: 0, m: 0, c: 0, r: 0, o: 0, rf: 0, t: 0 });

    } },
    { id: 'payments', group: 'Money', name: 'Payments', desc: 'Every payment with method, tax and who took it', filters: ['range', 'fac'], run(from, to) {
      const rows = ledger().filter(p => inRange(p.at, from, to) && facOk(p.facilityId)).map(p => [tstr(p.at), kindName[p.kind] || p.kind, p.ref || '', p.plate || '', fname(p.facilityId), ParkRules.METHODS[p.method] || p.method || '', fx(p.amount), fx(p.tax), fx(p.refunded), p.by || '', p.pid && !String(p.pid).startsWith('sim_') ? p.pid : (String(p.pid || '').startsWith('sim_') ? 'simulated' : '')]);
      const tot = rows.reduce((a, r) => a + (+r[6]), 0), rf = rows.reduce((a, r) => a + (+r[8]), 0);
      return { cols: ['When', 'Type', 'Reference', 'Plate', 'Location', 'Method', 'Amount', 'Tax', 'Refunded', 'Taken by', 'Processor id'], rows, totals: ['Total', rows.length + ' payments', '', '', '', '', fx(tot), '', fx(rf), '', ''], note: 'Amounts include sales tax. Refunds are shown on the payment they reverse.' };
    } },
    { id: 'shift', group: 'Money', name: 'Shift close-out', desc: 'Cash, card and checks by attendant and day', filters: ['range', 'fac'], run(from, to) {
      const m = new Map();
      ledger().filter(p => inRange(p.at, from, to) && facOk(p.facilityId) && ['cash', 'card', 'check', 'terminal', 'office', 'comp'].includes(p.method)).forEach(p => { const k = dayKey(p.at) + '|' + (p.by || 'unknown'); const r = m.get(k) || { day: dayKey(p.at), by: p.by || 'unknown', cash: 0, card: 0, check: 0, comp: 0, n: 0 }; r[p.method === 'terminal' || p.method === 'office' ? 'card' : p.method] += p.amount; r.n++; m.set(k, r); });
      const rows = [...m.values()].sort((a, b) => b.day.localeCompare(a.day) || a.by.localeCompare(b.by)).map(r => [r.day, r.by, r.n, fx(r.cash), fx(r.card), fx(r.check), fx(r.comp), fx(r.cash + r.card + r.check)]);
      const t = [...m.values()].reduce((a, r) => ({ n: a.n + r.n, cash: a.cash + r.cash, card: a.card + r.card, check: a.check + r.check, comp: a.comp + r.comp }), { n: 0, cash: 0, card: 0, check: 0, comp: 0 });
      return { cols: ['Day', 'Attendant', 'Payments', 'Cash', 'Card', 'Check', 'Complimentary', 'Total'], rows, totals: ['Total', '', t.n, fx(t.cash), fx(t.card), fx(t.check), fx(t.comp), fx(t.cash + t.card + t.check)], note: 'Payments recorded at the exit desk or valet stand, by the staff account that took them. Compare cash with the drawer count. Online and autopay payments are not shift cash.' };
    } },
    { id: 'waived', group: 'Money', name: 'Waived & adjusted', desc: 'Balances waived, fees changed, notices voided, with reasons', filters: ['range', 'fac'], run(from, to) {
      const rows = [];
      S.sessions.forEach(s => {

  /* Monthly parkers from a spreadsheet (hosted: the server checks plans, companies and duplicate plates). */
